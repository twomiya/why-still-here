<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>你为什么还没辞职？｜互动测试原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --ink: #272344; --muted: #66647e; --accent: #6553b7; --accent-deep: #51409c;
      --accent-soft: #f0ecfc; --line: #e5e0f1; --surface: #fff;
      color: var(--ink); background: #f7f6fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% -10%, #e7defa 0, transparent 42%), #f7f6fc; }
    main { width: min(100% - 36px, 620px); margin: 0 auto; padding: 48px 0 max(72px, env(safe-area-inset-bottom)); }
    h1, h2, p { overflow-wrap: anywhere; }
    h1 { margin: 18px 0 16px; font-size: clamp(38px, 9vw, 60px); line-height: 1.15; letter-spacing: -.045em; }
    h2 { margin: 18px 0; font-size: clamp(25px, 6vw, 34px); line-height: 1.35; letter-spacing: -.025em; }
    p { color: var(--muted); line-height: 1.7; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .lead { margin: 0 0 30px; max-width: 520px; font-size: clamp(16px, 4vw, 18px); }
    .card { border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 5vw, 36px); background: var(--surface); box-shadow: 0 16px 48px #3630600b; }
    .pill { display: inline-block; border-radius: 50px; background: var(--accent-soft); color: var(--accent-deep); padding: 7px 12px; font-size: 13px; font-weight: 700; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .button, .choice, .text-button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .button { appearance: none; border: 0; border-radius: 14px; background: var(--accent); color: #fff; padding: 14px 24px; min-height: 54px; font-weight: 700; }
    .button:hover { background: var(--accent-deep); }
    .button:focus-visible, .choice:focus-visible, .text-button:focus-visible { outline: 3px solid #a696ed; outline-offset: 3px; }
    .text-button { border: 0; background: transparent; color: var(--accent-deep); font-weight: 700; min-height: 48px; padding: 10px 2px; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
    .progress-wrap { height: 7px; background: var(--line); border-radius: 9px; overflow: hidden; margin: 14px 0 26px; }
    .progress { height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
    .choices { display: grid; gap: 10px; margin-top: 26px; }
    .choice { width: 100%; min-height: 56px; padding: 15px 17px; text-align: left; line-height: 1.5; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; overflow-wrap: anywhere; }
    .choice:hover { border-color: var(--accent); background: #fbfaff; }
    .choice.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
    .result-card { position: relative; overflow: hidden; margin-top: 22px; }
    .result-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: var(--accent); }
    .result-card p { margin: 0; font-size: 16px; }
    .result-card .text-button { margin-top: 16px; }
    .evidence { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .evidence h3 { margin: 0 0 10px; font-size: 15px; }
    .evidence ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .evidence li + li { margin-top: 8px; }
    .share-card { margin-top: 14px; padding: 22px; border-radius: 20px; background: #322a5e; color: #fff; }
    .share-card .eyebrow { color: #d8cbff; }
    .share-card h3 { margin: 14px 0 8px; color: #fff; font-size: clamp(19px, 5vw, 24px); line-height: 1.4; overflow-wrap: anywhere; }
    .share-card p { margin: 0; color: #e1ddef; font-size: 13px; }
    .share-card .button { margin-top: 18px; min-height: 48px; background: #fff; color: var(--accent-deep); }
    .share-card .button:hover { background: var(--accent-soft); }
    .share-actions { display: flex; gap: 10px; }
    .share-card .button.outline { background: transparent; color: #fff; border: 1px solid #c7b8f0; }
    .share-card .button.outline:hover { background: #4a407c; }
    .share-card .muted { display: block; margin-top: 10px; color: #e1ddef; }
    .result-note { display: block; margin-top: 6px; }
    @media (max-width: 520px) {
      main { width: calc(100% - 32px); padding-top: max(28px, env(safe-area-inset-top)); }
      .card { border-radius: 20px; }
      .button { width: 100%; }
      .result-card { margin-top: 18px; }
      .share-card { padding: 20px; }
      .share-actions { flex-direction: column; gap: 0; }
      .choices { gap: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .progress { transition: none; } }
  </style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const SCALE = [
    {id:'1', label:'非常不同意'}, {id:'2', label:'不同意'}, {id:'3', label:'说不清'},
    {id:'4', label:'同意'}, {id:'5', label:'非常同意'}
  ];
  const questions = [
    {title:'如果现在离职，短期没有收入，基本开销会怎样？', options:[['a','很快受到影响'],['b','可以支撑一段时间，但压力明显'],['c','暂时不受影响'],['skip','不想回答']]},
    {title:'是否有人在经济上依赖你？', options:[['a','是，且我承担主要开销'],['b','是，但有人共同承担'],['c','没有'],['skip','不想回答']]},
    {title:'目前有没有可执行的下一步？', options:[['a','已有明确的新工作机会'],['b','正在面试或接触机会'],['c','还没有开始寻找'],['skip','不想回答']]},
    {title:'离职前有没有必须先解决的具体限制？', subtitle:'例如签证、合同或福利衔接。', options:[['a','有'],['b','不确定'],['c','没有'],['skip','不想回答']]},
    {title:'即使有生活费储备，我仍很难接受新工作的不确定性。', options:SCALE},
    {title:'上次看到一个条件不错的外部岗位，你最先做了什么？', options:[['s','先算收入和试用期等风险'],['a','想到现在工作里舍不得的人或积累'],['u','继续搜集信息、比较机会'],['none','最近没有遇到过']]},
    {title:'即使新工作的长期前景不明朗，我也能决定先尝试。', options:SCALE},
    {title:'即使拿到条件相近的机会，我仍会舍不得现在的团队或工作内容。', options:SCALE},
    {title:'最近一次认真想离职却留下来，最直接的原因是什么？', options:[['r','当时经济或其他现实条件不允许'],['a','现职仍有我想保留的东西'],['u','没有足够信息判断下一份会不会更好'],['none','其他／记不清']]},
    {title:'如果外部机会条件相近，我不会因为“这里待久了”而留下。', options:SCALE},
    {title:'我查了很多离职或求职信息，却仍然很难推进决定。', options:SCALE},
    {title:'如果本周出现一个你感兴趣的岗位，你最可能先做什么？', subtitle:'这是假设情境；结果会更重视你真实经历的回答。', options:[['s','确认收入与风险能否承受'],['a','比较它和现职中舍不得的部分'],['u','继续寻找更多机会，暂时不申请'],['go','直接申请，再逐步了解']]},
    {title:'只要掌握关键事实，即使结果无法保证，我也能做决定。', options:SCALE},
    {title:'假如新工作收入相近，且生活开销已有安排，你现在更想？', options:[['leave','离开'],['stay','留下'],['unsure','仍然难决定']]},
    {title:'过去一个月，你实际做过哪一步？', options:[['active','投递、面试或谈过新机会'],['research','查过信息或和人讨论'],['none','还没有行动']]}
  ];
  let step = -1;
  let answers = Array(questions.length).fill(null);
  const escapeHTML = str => String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const answerLabel = index => {
    const option = questions[index].options.find(item => (Array.isArray(item) ? item[0] : item.id) === answers[index]);
    return option ? (Array.isArray(option) ? option[1] : option.label) : '';
  };
  const publicUrl = () => location.protocol === 'https:' ? `${location.origin}${location.pathname}` : '';
  function saveShareImage(title) {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#322a5e';
    ctx.fillRect(0, 0, 1080, 1350);
    ctx.fillStyle = '#9c8bea';
    ctx.fillRect(90, 112, 100, 9);
    ctx.fillStyle = '#d8cbff';
    ctx.font = '700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    ctx.fillText('你为什么还没辞职？', 90, 212);
    ctx.fillStyle = '#fff';
    ctx.font = '700 76px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    let line = '';
    let y = 480;
    for (const char of Array.from(title)) {
      if (line && ctx.measureText(line + char).width > 880) {
        ctx.fillText(line, 90, y);
        line = char;
        y += 112;
      } else line += char;
    }
    if (line) ctx.fillText(line, 90, y);
    ctx.fillStyle = '#e1ddef';
    ctx.font = '30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    ctx.fillText('一个帮你整理想法的小测试', 90, 1110);
    const url = publicUrl();
    ctx.font = '25px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    ctx.fillText(url ? (url.length > 70 ? `${url.slice(0, 67)}…` : url) : '本地预览 · 请从公开网址分享', 90, 1180);
    const link = document.createElement('a');
    link.download = '你为什么还没辞职-分享卡.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
  }
  function showIntro() {
    step = -1;
    app.innerHTML = `<div class="eyebrow">工作选择 · 自我梳理</div>
      <h1>你为什么<br>还没辞职？</h1>
      <p class="lead">想离开，却还没走。花几分钟，看看是什么让你留在现在的工作里。</p>
      <div class="card"><span class="pill">约 3 分钟 · 15 题</span>
      <p>根据你的选择，得到一条简短结果和对应的答题依据。不判断你该不该辞职，也不是心理诊断。</p>
      <p class="muted">答案只在当前页面处理，不上传、不保存；刷新页面会清空。</p>
      <button class="button" id="start">开始测试</button></div>`;
    document.getElementById('start').addEventListener('click', () => showQuestion(0));
  }
  function showQuestion(index) {
    step = index;
    const q = questions[index];
    const options = q.options.map(option => {
      const id = Array.isArray(option) ? option[0] : option.id;
      const text = Array.isArray(option) ? option[1] : option.label;
      return `<button type="button" class="choice${answers[index] === id ? ' selected' : ''}" data-choice="${escapeHTML(id)}" aria-pressed="${answers[index] === id}">${escapeHTML(text)}</button>`;
    }).join('');
    app.innerHTML = `<div class="eyebrow">你为什么还没辞职？</div>
      <div class="progress-wrap" role="progressbar" aria-label="答题进度" aria-valuenow="${index + 1}" aria-valuemin="0" aria-valuemax="${questions.length}"><div class="progress" style="width:${((index + 1) / questions.length) * 100}%"></div></div>
      <div class="card"><span class="pill">第 ${index + 1} / ${questions.length} 题</span>
      <h2 id="question-heading" tabindex="-1">${escapeHTML(q.title)}</h2>
      ${q.subtitle ? `<p class="muted">${escapeHTML(q.subtitle)}</p>` : ''}
      <div class="choices" role="group" aria-labelledby="question-heading">${options}</div>
      <div class="actions"><button type="button" class="text-button" id="back">${index ? '← 上一题' : '← 返回首页'}</button></div></div>`;
    document.getElementById('question-heading').focus();
    app.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => {
      answers[index] = button.dataset.choice;
      if (index + 1 === questions.length) showResult();
      else showQuestion(index + 1);
    }));
    document.getElementById('back').addEventListener('click', () => index ? showQuestion(index - 1) : showIntro());
  }
  function analyze() {
    const value = (index, reverse = false) => {
      const n = Number(answers[index]);
      return Number.isInteger(n) && n >= 1 && n <= 5 ? (reverse ? 6 - n : n) : null;
    };
    const dimensions = [
      {key:'s', name:'对稳定的需要', values:[value(4),value(6,true)]},
      {key:'a', name:'对现职的留恋', values:[value(7),value(9,true)]},
      {key:'u', name:'决策迟滞', values:[value(10),value(12,true)]}
    ];
    // 行为题是辅助证据，不足以独自触发一个心理结论。
    for (const d of dimensions) {
      d.core = d.values.every(v => v !== null) ? (d.values[0] + d.values[1]) / 2 : null;
      d.support = [answers[5], answers[8], answers[11]].filter(v => v === d.key).length;
      d.rank = d.core === null ? 0 : d.core + Math.min(d.support, 2) * .25;
    }
    dimensions.sort((x,y) => y.rank - x.rank);
    const [top, second] = dimensions;
    const reality = answers[0] === 'a' || answers[3] === 'a' || answers[8] === 'r';
    let type = 'unclear';
    if (reality && answers[13] === 'leave') type = 'reality';
    else if (reality) type = 'mixed';
    else if (top.core !== null && top.core >= 3.75 && top.rank - second.rank >= .5) {
      // 反事实题不吻合时，不强行输出唯一心理原因。
      if (top.key === 'a' && answers[13] !== 'leave') type = 'attachment';
      else if (top.key === 'u' && answers[13] === 'unsure') type = 'uncertainty';
      else if (top.key === 's' && answers[13] !== 'leave') type = 'stability';
    }
    return {type, reality, dimensions};
  }
  const copy = {
    reality: {headline:'你想走，但现实条件还挡在前面。', body:'目前最明确的阻力是实际成本。若收入与开销已有安排，你更倾向离开。', share:'想离开，也要先给自己留出选择的空间。'},
    mixed: {headline:'你留下，可能不止一个原因。', body:'除了现实限制，你对离开这件事仍有犹豫。解决眼前条件，也未必会立刻改变决定。', share:'留下来，有时不只因为一个理由。'},
    attachment: {headline:'你想改变，也舍不得现在的积累。', body:'团队、工作内容或已有积累，是你仍想留下的一部分原因。', share:'想改变，也可以同时舍不得。'},
    uncertainty: {headline:'你还在等一个更确定的答案。', body:'你已经想过离开，但对下一步的信息和结果仍拿不准。', share:'有时难的不是选择，而是接受不确定。'},
    stability: {headline:'变化的不确定性让你犹豫。', body:'相比马上换工作，你现在更在意稳定和可预期的风险。', share:'我在意的，是变化有没有边界。'},
    unclear: {headline:'目前还看不出唯一原因。', body:'你的选择没有一致地指向同一种阻力；与其勉强归类，不如保留这个不确定性。', share:'还没想清楚，也是一种诚实的答案。'}
  };
  function resultEvidence(type) {
    const choice = index => `第 ${index + 1} 题：你对「${questions[index].title}」选择「${answerLabel(index)}」。`;
    if (type === 'reality' || type === 'mixed') {
      const items = [];
      if (answers[0] === 'a') items.push('第 1 题：你表示短期没有收入会很快影响基本开销。');
      if (answers[3] === 'a') items.push('第 4 题：你表示离职前有必须解决的具体限制。');
      if (answers[8] === 'r') items.push('第 9 题：你上次留下，是因为现实条件暂时不允许。');
      return [...items.slice(0, 2), choice(13)];
    }
    const dimensions = {stability:[4,6], attachment:[7,9], uncertainty:[10,12]};
    if (dimensions[type]) return dimensions[type].map(choice);
    return [choice(13), choice(8)];
  }
  function showResult() {
    step = questions.length;
    const result = analyze();
    const text = copy[result.type];
    const evidence = resultEvidence(result.type);
    app.innerHTML = `<div class="eyebrow">测试结果</div>
      <div class="card result-card"><span class="pill">你的结果</span>
      <h2>${escapeHTML(text.headline)}</h2>
      <p>${escapeHTML(text.body)}</p>
      <div class="evidence"><h3>判断依据</h3><ul>${evidence.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ul></div>
      <button class="text-button" id="restart">重新测试</button>
      <small class="muted result-note">仅供自我梳理，不是心理诊断或辞职建议。</small></div>
      <div class="share-card" aria-label="分享卡预览"><div class="eyebrow">分享卡 · 不含原始回答</div>
      <h3>${escapeHTML(text.share)}</h3><p>你为什么还没辞职？｜一个帮你整理想法的小测试</p>
      <div class="share-actions"><button class="button" id="share">分享测试</button><button class="button outline" id="save-image">保存卡片图片</button></div>
      <small class="muted" id="share-status" role="status"></small></div>`;
    document.getElementById('restart').addEventListener('click', () => { answers = Array(questions.length).fill(null); showIntro(); });
    document.getElementById('save-image').addEventListener('click', () => saveShareImage(text.share));
    document.getElementById('share').addEventListener('click', async () => {
      const url = publicUrl();
      const shareText = `${text.share}\n来测测：你为什么还没辞职？${url ? `\n${url}` : ''}`;
      const status = document.getElementById('share-status');
      try {
        if (url && navigator.share) await navigator.share({title:'你为什么还没辞职？', text:text.share, url});
        else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(shareText);
          status.textContent = '已复制分享文案和测试链接。';
        } else status.textContent = '当前环境不支持一键分享，请手动复制卡片文字。';
      } catch (error) {
        if (error.name !== 'AbortError') status.textContent = '分享未完成，请手动复制卡片文字。';
      }
    });
  }
  showIntro();
  // 仅供本地自动化验证；不向网络发送任何数据。
  window.__quizTest = {getQuestions: () => questions.map(q => q.title), getState: () => ({step, answers:[...answers]}), answer: (index,id) => {answers[index]=id;}, analyze, showResult, showQuestion};
})();
</script>
</body>
</html>
